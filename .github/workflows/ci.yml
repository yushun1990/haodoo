name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build with Classic catalog
        run: npm run build

      - name: Reader smoke test in Chromium
        run: npm run test:reader-smoke

      - name: Install Playwright Firefox
        run: npx playwright-core install firefox

      - name: Reader smoke test in Firefox
        run: READER_BROWSER=firefox npm run test:reader-smoke
